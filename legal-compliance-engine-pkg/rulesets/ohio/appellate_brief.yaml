# Ohio Court of Appeals - Appellate Brief Format
# Based on Ohio App. R. 16 and Ohio App. R. 19
# Key conventions:
# - Font: 12-point proportional or 10-point monospaced
# - Margins: 1" all sides
# - Double-spaced
# - "Assignments of Error" is the canonical Ohio term for issues
# - No word/page limit by rule (varies by district)

jurisdiction: ohio
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 12.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Authorities Cited"
      - "Table of Cases and Authorities"
    order: 2
    required: true
    heading_level: 1

  - id: assignments_of_error
    canonical_name: "Assignments of Error"
    aliases:
      - "Errors Assigned"
      - "Statement of the Issues"
      - "Issues Presented"
      - "Issues on Appeal"
      - "Assignments of Error Presented for Review"
    order: 3
    required: true
    heading_level: 1

  - id: statement_of_issues
    canonical_name: "Issues Presented for Review"
    aliases:
      - "Issues Relating to Assignments of Error"
      - "Questions Presented"
    order: 4
    required: false
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Procedural History"
      - "Nature of the Case"
    order: 5
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 6
    required: true
    heading_level: 1

  - id: standard_of_review
    canonical_name: "Standard of Review"
    aliases:
      - "Standards of Review"
      - "Law and Standard of Review"
    order: 7
    required: false
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Law and Argument"
      - "Discussion"
    order: 8
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 9
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "Case No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: left
  party_role_indented: true
  document_title_style: upper
  document_title_alignment: center
  include_district: true
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    {attorney_title}
    Ohio Bar No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that a true and correct copy of the foregoing
      was served upon counsel for all parties by {service_method}
      on {date}.

      {attorney_name}

signature_block_required: true
