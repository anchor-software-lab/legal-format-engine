# North Carolina Court of Appeals - Appellate Brief Format
# Based on N.C. R. App. P. 28 and 26
# Key conventions:
# - Font: Proportional 14-point or monospaced 12-point
# - Margins: 1" top/bottom, 1" left/right
# - Double-spaced
# - Word limit: 8,750 words
# - Unique required sections: "Statement of the Grounds for Appellate Review"

jurisdiction: north_carolina
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 14.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Table of Cases and Authorities"
      - "Authorities Cited"
    order: 2
    required: true
    heading_level: 1

  - id: statement_of_issues
    canonical_name: "Issues Presented"
    aliases:
      - "Statement of the Issues"
      - "Issues on Appeal"
      - "Questions Presented"
      - "Issues"
    order: 3
    required: true
    heading_level: 1

  - id: grounds_for_appellate_review
    canonical_name: "Statement of the Grounds for Appellate Review"
    aliases:
      - "Grounds for Appellate Review"
      - "Basis for Appellate Review"
      - "Grounds for Review"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Procedural History"
      - "Statement of Case"
    order: 5
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 6
    required: true
    heading_level: 1

  - id: standards_of_review
    canonical_name: "Standard of Review"
    aliases:
      - "Standards of Review"
      - "Standard of Appellate Review"
    order: 7
    required: false
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 8
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 9
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    N.C. State Bar No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      I certify that this brief complies with the type-volume
      limitations of N.C. R. App. P. 28(j). This brief contains
      {word_count} words, excluding the cover, table of contents,
      table of authorities, certificate of compliance, certificate
      of service, and any appendix.

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that on {date}, a copy of this brief was
      served on all parties by {service_method}.

      {attorney_name}

  - id: certificate_of_filing
    title: "Certificate of Filing"
    template: |
      I certify that this brief has been filed with the Clerk of
      the North Carolina Court of Appeals by {filing_method} on
      {date}.

      {attorney_name}

signature_block_required: true
