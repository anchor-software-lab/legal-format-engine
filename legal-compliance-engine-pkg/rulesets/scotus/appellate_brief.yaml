# Supreme Court of the United States - Appellate Brief
# Derived from Sup. Ct. R. 33 and Sup. Ct. R. 34
# Booklet format with strict word limits per Sup. Ct. R. 33.1

name: "SCOTUS Appellate Brief"
jurisdiction: "federal"
court_level: "supreme_court"
document_type: "appellate_brief"
description: "Supreme Court of the United States appellate brief format"
statute_reference: "Sup. Ct. R. 33"

page_format:
  font: "Century Schoolbook"
  font_size_pt: 12
  line_spacing: "double"
  margin_top_inches: 0.75
  margin_bottom_inches: 0.75
  margin_left_inches: 0.75
  margin_right_inches: 0.75
  page_width_inches: 6.125
  page_height_inches: 9.25
  first_line_indent_inches: 0.5
  hyphenation: false
  booklet_format: true

page_limit: null
word_limit: 9000
allow_combined_case_facts: false

heading_rules:
  - level: 1
    style: "title_case_centered"
    bold: true
    centered: true
    indent_inches: 0.0
  - level: 2
    style: "roman_numeral"
    bold: true
    centered: false
    indent_inches: 0.0
  - level: 3
    style: "capital_letter"
    bold: true
    centered: false
    indent_inches: 0.5
  - level: 4
    style: "arabic_numeral"
    bold: false
    centered: false
    indent_inches: 1.0

section_rules:
  - section_type: "questions_presented"
    title: "Questions Presented"
    required: true
    order: 1
    heading_level: 1
    aliases:
      - "Questions Presented"
      - "Question Presented"

  - section_type: "parties_to_the_proceeding"
    title: "Parties to the Proceeding"
    required: true
    order: 2
    heading_level: 1
    aliases:
      - "Parties to the Proceeding"
      - "List of Parties"

  - section_type: "table_of_contents"
    title: "Table of Contents"
    required: true
    order: 3
    heading_level: 1
    aliases:
      - "Table of Contents"
      - "Contents"
      - "TOC"

  - section_type: "table_of_authorities"
    title: "Table of Authorities"
    required: true
    order: 4
    heading_level: 1
    aliases:
      - "Table of Authorities"
      - "Authorities Cited"

  - section_type: "opinions_below"
    title: "Opinions Below"
    required: true
    order: 5
    heading_level: 1
    aliases:
      - "Opinions Below"
      - "Opinion Below"

  - section_type: "jurisdictional_statement"
    title: "Jurisdictional Statement"
    required: true
    order: 6
    heading_level: 1
    aliases:
      - "Jurisdictional Statement"
      - "Jurisdiction"
      - "Statement of Jurisdiction"

  - section_type: "constitutional_and_statutory_provisions"
    title: "Constitutional and Statutory Provisions Involved"
    required: true
    order: 7
    heading_level: 1
    aliases:
      - "Constitutional and Statutory Provisions Involved"
      - "Constitutional Provisions Involved"
      - "Statutory Provisions Involved"

  - section_type: "statement_of_case"
    title: "Statement of the Case"
    required: true
    order: 8
    heading_level: 1
    aliases:
      - "Statement of the Case"
      - "Statement"

  - section_type: "summary_of_argument"
    title: "Summary of Argument"
    required: true
    order: 9
    heading_level: 1
    aliases:
      - "Summary of Argument"
      - "Summary of the Argument"

  - section_type: "argument"
    title: "Argument"
    required: true
    order: 10
    heading_level: 1
    aliases:
      - "Argument"
      - "Arguments"

  - section_type: "conclusion"
    title: "Conclusion"
    required: true
    order: 11
    heading_level: 1
    aliases:
      - "Conclusion"
      - "Prayer for Relief"

  - section_type: "appendix"
    title: "Appendix"
    required: false
    order: 12
    heading_level: 1
    aliases:
      - "Appendix"
      - "Appendices"

certification_templates:
  - cert_type: "form_length"
    title: null
    template: >-
      As required by Supreme Court Rule 33.1(h), I certify that the brief
      contains {word_count} words, excluding the parts of the brief that are
      exempted by Supreme Court Rule 33.1(d).
    required: true

  - cert_type: "service"
    title: null
    template: >-
      I hereby certify that on this date I have served the enclosed brief
      on all parties required to be served by depositing the same in the
      United States mail, first-class postage prepaid, or by delivering to
      a third-party commercial carrier for delivery within 3 calendar days,
      addressed to counsel of record.
    required: true
