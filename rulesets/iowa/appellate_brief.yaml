# Iowa Court of Appeals - Appellate Brief Format
# Based on Iowa R. App. P. 6.903 and 6.904
# Formatting requirements per Iowa Rules of Appellate Procedure.
#
# Key conventions:
# - Margins: 1" all sides
# - Font: Times New Roman 14pt, double-spaced
# - Word limit: 14,000 words (final brief)
# - "Routing Statement" required for Iowa Supreme Court
# - Certificate of compliance required

jurisdiction: iowa
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 14
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Table of Cases and Authorities"
      - "Authorities Cited"
      - "Cases Cited"
    order: 2
    required: true
    heading_level: 1

  - id: routing_statement
    canonical_name: "Routing Statement"
    aliases:
      - "Statement on Routing"
      - "Transfer Statement"
    order: 3
    required: true
    heading_level: 1

  - id: statement_of_issues
    canonical_name: "Statement of Issues Presented for Review"
    aliases:
      - "Issues Presented"
      - "Issues Presented for Review"
      - "Issues"
      - "Questions Presented"
      - "Statement of the Issues"
      - "Statement of Issues"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Statement of Case"
      - "Procedural History"
      - "Nature of the Case"
    order: 5
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of the Facts"
    aliases:
      - "Statement of Facts"
      - "Facts"
      - "Factual Background"
    order: 6
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 7
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 8
    required: true
    heading_level: 1

  - id: request_for_oral_argument
    canonical_name: "Request for Oral Argument"
    aliases:
      - "Oral Argument Statement"
      - "Statement on Oral Argument"
    order: 9
    required: false
    heading_level: 1

  - id: certificate_of_compliance
    canonical_name: "Certificate of Compliance"
    aliases:
      - "Certification of Compliance"
      - "Certificate of Word Count"
    order: 10
    required: true
    heading_level: 1

  - id: certificate_of_service
    canonical_name: "Certificate of Service"
    aliases:
      - "Proof of Service"
      - "Service Certificate"
      - "Certificate of Filing and Service"
    order: 11
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {firm_name}

    By: ____________________________
    {attorney_name}
    Iowa Bar No. {bar_number}

    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      This brief complies with the type-volume limitation of
      Iowa R. App. P. 6.903(1)(g)(1) or (2) because this brief
      contains {word_count} words, excluding the parts of the
      brief exempted by Iowa R. App. P. 6.903(1)(g)(1).

      This brief complies with the typeface requirements of
      Iowa R. App. P. 6.903(1)(e) and the type-style requirements
      of Iowa R. App. P. 6.903(1)(f) because this brief has been
      prepared in a proportionally spaced typeface using
      Times New Roman in 14-point font size.

      {attorney_name}
      Attorney for {party_role}

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that on {date}, I served the foregoing
      upon all other parties to this appeal by [method of service].

      {attorney_name}

signature_block_required: true
