# Oregon Court of Appeals - Appellate Brief Format
# Based on ORAP 5.05 and 5.52 (Oregon Rules of Appellate Procedure)
# Key conventions:
# - Font: 14-point proportional or 12-point monospaced (Courier)
# - Margins: 1" all sides
# - Double-spaced (1.5 also accepted)
# - Word limit: 14,000 words for opening brief
# - "Assignments of Error" is required

jurisdiction: oregon
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 14.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Index of Authorities"
      - "Authorities Cited"
    order: 2
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Procedural History"
      - "Nature of the Proceeding"
      - "Nature of the Action"
    order: 3
    required: true
    heading_level: 1

  - id: questions_presented
    canonical_name: "Questions Presented on Appeal"
    aliases:
      - "Questions Presented"
      - "Issues Presented"
      - "Issues on Appeal"
      - "Statement of the Issues"
    order: 4
    required: true
    heading_level: 1

  - id: summary_of_argument
    canonical_name: "Summary of Argument"
    aliases:
      - "Summary of the Argument"
      - "Summary"
    order: 5
    required: false
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 6
    required: true
    heading_level: 1

  - id: assignments_of_error
    canonical_name: "Assignments of Error"
    aliases:
      - "Errors Assigned"
      - "Assignments"
    order: 7
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 8
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 9
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: center
  case_number_prefix: "CA"
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    OSB No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance with Brief Length Limitations"
    template: |
      I certify that this brief complies with the word-count
      limitation in ORAP 5.05(2)(b). The word count of this brief
      (as described in ORAP 5.05(2)(a)) is {word_count} words.

  - id: certificate_of_filing_and_service
    title: "Certificate of Filing and Service"
    template: |
      I certify that on {date}, I filed the original of this brief
      with the State Court Administrator by {filing_method} and
      served copies on all parties by {service_method}.

      {attorney_name}

signature_block_required: true
