# Texas Court of Appeals - Appellate Brief Format
# Based on Tex. R. App. P. 9 and 38
# Key conventions:
# - Font: 13-point proportional or 10-point monospaced (Courier)
# - Margins: 1" top/bottom, 1" left/right (1.5" left for binding)
# - Double-spaced (or 1.5)
# - Word limit: 15,000 words for appellant's brief
# - Identity of parties and counsel required

jurisdiction: texas
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 13.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: identity_of_parties
    canonical_name: "Identity of Parties and Counsel"
    aliases:
      - "Parties and Counsel"
      - "Identity of Parties"
      - "List of Parties"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 2
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Index of Authorities"
    aliases:
      - "Table of Authorities"
      - "Authorities Cited"
      - "Table of Cases and Authorities"
    order: 3
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Nature of the Case"
      - "Procedural History"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_issues
    canonical_name: "Issues Presented"
    aliases:
      - "Statement of the Issues"
      - "Issues on Appeal"
      - "Questions Presented"
      - "Points of Error"
      - "Issues Presented for Review"
    order: 5
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 6
    required: true
    heading_level: 1

  - id: summary_of_argument
    canonical_name: "Summary of the Argument"
    aliases:
      - "Summary of Argument"
      - "Summary"
    order: 7
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 8
    required: true
    heading_level: 1

  - id: prayer
    canonical_name: "Prayer"
    aliases:
      - "Conclusion"
      - "Prayer for Relief"
      - "Relief Requested"
    order: 9
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: true
  document_title_style: upper
  document_title_alignment: center
  include_district: true
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    State Bar No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {fax}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      Pursuant to Tex. R. App. P. 9.4, I hereby certify that
      this brief contains {word_count} words. This is a
      computer-generated document created in {word_processor}
      using {font_name} {font_size}-point typeface for the body
      and {footnote_size}-point typeface for footnotes.

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I certify that on {date}, a true and correct copy of the
      foregoing was served on all parties through {service_method}.

      {attorney_name}

signature_block_required: true
