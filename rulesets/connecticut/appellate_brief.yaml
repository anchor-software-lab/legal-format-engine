# Connecticut Appellate Court - Appellate Brief Format
# Based on Conn. R. App. P. Sec. 67-2, 67-4, and Practice Book Sec. 67-1 et seq.
# Formatting requirements per Connecticut Rules of Appellate Procedure.
#
# Key conventions:
# - Margins: 1" all sides
# - Font: Times New Roman 12pt, double-spaced
# - Word limit: 14,000 words (principal brief)
# - Nature of the Proceedings required
# - Certificate of compliance required

jurisdiction: connecticut
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 12
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Table of Cases and Authorities"
      - "Authorities Cited"
      - "Cases Cited"
    order: 2
    required: true
    heading_level: 1

  - id: statement_of_issues
    canonical_name: "Statement of the Issues"
    aliases:
      - "Issues Presented"
      - "Issues Presented for Review"
      - "Issues"
      - "Questions Presented"
      - "Statement of Issues"
    order: 3
    required: true
    heading_level: 1

  - id: nature_of_proceedings
    canonical_name: "Nature of the Proceedings"
    aliases:
      - "Nature of Proceedings"
      - "Procedural History"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 5
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 6
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 7
    required: true
    heading_level: 1

  - id: certificate_of_service
    canonical_name: "Certification"
    aliases:
      - "Certificate of Service"
      - "Proof of Service"
      - "Service Certificate"
    order: 8
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: center
  case_number_prefix: "AC"
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    THE {party_role}

    By: ____________________________
    {attorney_name}
    Juris No. {bar_number}

    {firm_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      I hereby certify that this brief complies with the
      word count limitation of Section 67-4 of the Connecticut
      Rules of Appellate Procedure. This brief contains
      {word_count} words, exclusive of the table of contents,
      table of authorities, and certificate of compliance.

      {attorney_name}

  - id: certification_of_service
    title: "Certification"
    template: |
      I hereby certify that on {date}, a copy of the foregoing
      brief was delivered electronically to all counsel of
      record as follows:

      [Names and addresses of parties served]

      {attorney_name}

signature_block_required: true
