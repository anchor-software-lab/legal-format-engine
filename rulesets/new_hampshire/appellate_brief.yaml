# New Hampshire Supreme Court - Appellate Brief Format
# Based on N.H. Sup. Ct. R. 16 and 26
# Key conventions:
# - Font: 13-point proportional serif
# - Margins: 1" all sides
# - Double-spaced body text
# - Word limit: 9,500 words

jurisdiction: new_hampshire
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 13.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: title
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Table of Cases and Authorities"
      - "Authorities Cited"
    order: 2
    required: true
    heading_level: 1

  - id: questions_presented
    canonical_name: "Questions Presented"
    aliases:
      - "Issues Presented"
      - "Issues on Appeal"
      - "Statement of the Issues"
      - "Issues Presented for Review"
    order: 3
    required: true
    heading_level: 1

  - id: statement_of_case_and_facts
    canonical_name: "Statement of the Case and Facts"
    aliases:
      - "Statement of the Case"
      - "Case and Facts"
      - "Statement of Facts"
      - "Facts"
      - "Factual Background"
      - "Procedural History"
    order: 4
    required: true
    heading_level: 1

  - id: summary_of_argument
    canonical_name: "Summary of Argument"
    aliases:
      - "Summary of the Argument"
      - "Summary"
    order: 5
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 6
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 7
    required: true
    heading_level: 1

  - id: request_for_oral_argument
    canonical_name: "Request for Oral Argument"
    aliases:
      - "Oral Argument Statement"
      - "Oral Argument Request"
    order: 8
    required: false
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: title
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    N.H. Bar No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_word_count
    title: "Certificate of Compliance"
    template: |
      I hereby certify that pursuant to New Hampshire Supreme Court
      Rule 16(11), the foregoing brief contains {word_count} words,
      which is within the word limit set by the Court.

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that on {date}, a copy of the foregoing
      brief was served upon all counsel of record by
      {service_method}.

      {attorney_name}

signature_block_required: true
