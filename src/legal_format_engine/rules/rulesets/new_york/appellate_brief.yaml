# New York Appellate Division - Appellate Brief Format
# Based on CPLR § 5528, 5529 and 22 NYCRR § 600.10 / § 670.10.3
# Key conventions:
# - Font: 14-point proportional or 12-point monospaced
# - Margins: 1" all sides
# - Double-spaced (single-spaced for quotations and footnotes)
# - Word limit: Varies by department (typically no page limit, some use 14,000 words)
# - Preliminary statement and point headings required

jurisdiction: new_york
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 14.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Table of Cases and Authorities"
      - "Authorities Cited"
    order: 2
    required: true
    heading_level: 1

  - id: preliminary_statement
    canonical_name: "Preliminary Statement"
    aliases:
      - "Introduction"
      - "Nature of the Case"
    order: 3
    required: true
    heading_level: 1

  - id: questions_presented
    canonical_name: "Questions Presented"
    aliases:
      - "Issues Presented"
      - "Issues on Appeal"
      - "Statement of the Issues"
      - "Points of Law"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Procedural History"
      - "Statement of Case"
    order: 5
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 6
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Point Headings"
      - "Points of Argument"
      - "Discussion"
    order: 7
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 8
    required: true
    heading_level: 1

  - id: printing_specifications_statement
    canonical_name: "Printing Specifications Statement"
    aliases:
      - "Certificate of Compliance"
      - "Statement of Compliance"
    order: 9
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "Index No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: true
  document_title_style: upper
  document_title_alignment: center
  include_district: true
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    {attorney_title}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: printing_specifications
    title: "Printing Specifications Statement"
    template: |
      Pursuant to 22 NYCRR § 600.10(d)(1)(v), this brief was
      prepared on a computer. A proportionally spaced typeface was
      used as follows:

      Name of typeface: {font_name}
      Point size: {font_size}
      Line spacing: Double

      The total number of words in the brief, inclusive of point
      headings and footnotes and exclusive of pages containing the
      table of contents, table of authorities, proof of service,
      certificate of compliance, or any authorized addendum is
      {word_count}.

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that on {date}, a true and correct copy
      of this brief was served upon all parties by {service_method}.

      {attorney_name}

signature_block_required: true
