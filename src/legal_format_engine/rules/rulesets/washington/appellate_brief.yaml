# Washington Court of Appeals - Appellate Brief Format
# Based on RAP 10.3 and 10.4 (Washington Rules of Appellate Procedure)
# Key conventions:
# - Font: 12-point proportional
# - Margins: 2" left, 1.5" right, 1" top/bottom (for court use)
# - Double-spaced
# - Word limit: 12,000 words for opening brief
# - "Assignments of Error" required with specific format

jurisdiction: washington
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 12.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 2.0
  margin_right_inches: 1.5
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Authorities Cited"
      - "Table of Cases and Authorities"
    order: 2
    required: true
    heading_level: 1

  - id: introduction
    canonical_name: "Introduction"
    aliases:
      - "Preliminary Statement"
    order: 3
    required: false
    heading_level: 1

  - id: assignments_of_error
    canonical_name: "Assignments of Error"
    aliases:
      - "Errors Assigned"
      - "Issues Presented"
      - "Statement of the Issues"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_issues
    canonical_name: "Issues Pertaining to Assignments of Error"
    aliases:
      - "Issues Presented"
      - "Questions Presented"
      - "Issues on Appeal"
    order: 5
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Procedural History"
    order: 6
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 7
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 8
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 9
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: left
  party_role_indented: true
  document_title_style: upper
  document_title_alignment: center
  include_district: true
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    WSBA No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      I certify that this brief contains {word_count} words in
      compliance with RAP 10.4(b), exclusive of appendices, title
      page, table of contents, and table of authorities.

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I certify that on {date}, I caused a copy of this brief
      to be served upon all counsel of record by {service_method}.

      {attorney_name}

signature_block_required: true
