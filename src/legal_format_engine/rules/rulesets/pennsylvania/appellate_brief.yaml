# Pennsylvania Superior/Commonwealth Court - Appellate Brief Format
# Based on Pa. R.A.P. 2111-2119 and 124
# Key conventions:
# - Font: Any clear typeface, minimum 14-point in text body
# - Margins: 1" all sides
# - Double-spaced
# - Page limit: 70 pages for principal brief (or 14,000 words)
# - "Statement of Errors" or "Statement of Questions Involved" required
# - Unique sections: "Order or Determination in Question"

jurisdiction: pennsylvania
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 14.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Citations"
    aliases:
      - "Table of Authorities"
      - "Authorities Cited"
      - "Table of Cases and Authorities"
    order: 2
    required: true
    heading_level: 1

  - id: statement_of_jurisdiction
    canonical_name: "Statement of Jurisdiction"
    aliases:
      - "Jurisdictional Statement"
      - "Jurisdiction"
      - "Basis for Jurisdiction"
    order: 3
    required: true
    heading_level: 1

  - id: order_in_question
    canonical_name: "Order or Other Determination in Question"
    aliases:
      - "Order in Question"
      - "Determination in Question"
      - "Order Appealed From"
      - "Text of Order"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_questions
    canonical_name: "Statement of the Questions Involved"
    aliases:
      - "Questions Involved"
      - "Questions Presented"
      - "Statement of the Issues"
      - "Issues Presented"
      - "Issues on Appeal"
      - "Statement of Errors"
    order: 5
    required: true
    heading_level: 1

  - id: scope_and_standard_of_review
    canonical_name: "Scope and Standard of Review"
    aliases:
      - "Standard of Review"
      - "Standards of Review"
      - "Scope of Review"
    order: 6
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Procedural History"
      - "History of the Case"
    order: 7
    required: true
    heading_level: 1

  - id: summary_of_argument
    canonical_name: "Summary of Argument"
    aliases:
      - "Summary of the Argument"
      - "Summary"
    order: 8
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 9
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 10
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: true
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    {attorney_title}
    Pa. I.D. No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      I certify that this filing complies with the provisions of
      the Public Access Policy of the Unified Judicial System of
      Pennsylvania: Case Records of the Appellate and Trial Courts
      that require filing confidential information and documents
      differently than non-confidential information and documents.

  - id: certificate_of_word_count
    title: "Certificate of Compliance with Word Count"
    template: |
      I certify that this brief complies with the type-volume
      limitation of Pa. R.A.P. 2135. This brief contains
      {word_count} words, exclusive of the supplementary matters
      set forth in Pa. R.A.P. 2135(b).

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that on {date}, a true and correct copy of
      the foregoing was served upon all counsel of record by
      {service_method}.

      {attorney_name}

signature_block_required: true
