# North Dakota Supreme Court - Appellate Brief Format
# Based on N.D. R. App. P. 28 and 32
# Key conventions:
# - Font: 14-point proportional serif
# - Margins: 1" all sides
# - Double-spaced
# - Word limit: 13,000 words for principal brief

jurisdiction: north_dakota
court_level: appellate
document_type: brief

page_format:
  font_name: "Century Schoolbook"
  font_size_pt: 14.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Authorities Cited"
      - "Table of Cases and Authorities"
    order: 2
    required: true
    heading_level: 1

  - id: paragraph_4
    canonical_name: "Statement of the Issues"
    aliases:
      - "Issues Presented"
      - "Questions Presented"
      - "Issues on Appeal"
      - "Statement of Issues"
    order: 3
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Procedural History"
      - "Procedural Background"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 5
    required: true
    heading_level: 1

  - id: standard_of_review
    canonical_name: "Standard of Review"
    aliases:
      - "Standards of Review"
    order: 6
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
      - "Law and Argument"
    order: 7
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 8
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: center
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    ND Bar ID No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      The undersigned certifies that this brief complies with the
      type-volume limitation of N.D. R. App. P. 32(a)(8). This
      brief contains {word_count} words, excluding the parts of
      the brief exempted by N.D. R. App. P. 32(a)(8)(A).

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I certify that on {date}, a true and correct copy of the
      foregoing was served upon all parties by {service_method}.

      {attorney_name}

signature_block_required: true
