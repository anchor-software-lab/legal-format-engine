# Oklahoma Court of Civil Appeals - Appellate Brief Format
# Based on Okla. Sup. Ct. R. 1.11 and Rule 1.301
# Key conventions:
# - Font: 13-point proportional or 10-point monospaced
# - Margins: 1" all sides
# - Double-spaced
# - Page limit: 50 pages for brief in chief
# - "Propositions of Law" or "Propositions of Error" heading style

jurisdiction: oklahoma
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 13.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Authorities Cited"
      - "Table of Cases and Authorities"
    order: 2
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Procedural History"
      - "Nature of the Case"
    order: 3
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 4
    required: true
    heading_level: 1

  - id: propositions_of_error
    canonical_name: "Propositions of Error"
    aliases:
      - "Propositions of Law"
      - "Issues Presented"
      - "Statement of the Issues"
      - "Questions Presented"
      - "Issues on Appeal"
    order: 5
    required: true
    heading_level: 1

  - id: summary_of_argument
    canonical_name: "Summary of Argument"
    aliases:
      - "Summary of the Argument"
      - "Summary"
    order: 6
    required: false
    heading_level: 1

  - id: argument
    canonical_name: "Argument and Authorities"
    aliases:
      - "Argument"
      - "Arguments"
      - "Discussion"
      - "Law and Argument"
    order: 7
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 8
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "Case No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    OBA No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance with Page Limitation"
    template: |
      I certify that this brief complies with the page limitation
      set forth in Okla. Sup. Ct. R. 1.11(b). This brief contains
      {page_count} pages.

  - id: certificate_of_service
    title: "Certificate of Mailing"
    template: |
      I hereby certify that on {date}, a true and correct copy
      of the foregoing was served upon all counsel of record by
      {service_method}.

      {attorney_name}

signature_block_required: true
