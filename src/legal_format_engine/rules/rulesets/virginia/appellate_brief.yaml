# Virginia Court of Appeals - Appellate Brief Format
# Based on Va. R. Sup. Ct. 5A:20 and 5A:4
# Key conventions:
# - Font: 14-point proportional or 12-point monospaced
# - Margins: 1" all sides
# - Double-spaced (1.5 also accepted)
# - Word limit: 12,300 words for opening brief
# - "Assignments of Error" is the Virginia term

jurisdiction: virginia
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 14.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Authorities Cited"
      - "Table of Cases and Authorities"
    order: 2
    required: true
    heading_level: 1

  - id: assignments_of_error
    canonical_name: "Assignments of Error"
    aliases:
      - "Errors Assigned"
      - "Issues Presented"
      - "Statement of the Issues"
      - "Questions Presented"
    order: 3
    required: true
    heading_level: 1

  - id: nature_of_case
    canonical_name: "Nature of the Case and Material Proceedings Below"
    aliases:
      - "Nature of the Case"
      - "Statement of the Case"
      - "Case Statement"
      - "Procedural History"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 5
    required: true
    heading_level: 1

  - id: standard_of_review
    canonical_name: "Standard of Review"
    aliases:
      - "Standards of Review"
    order: 6
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 7
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 8
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "Record No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: true
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    Virginia State Bar No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Counsel for {party_role}

certifications:
  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      Pursuant to Va. R. Sup. Ct. 5A:4(g), the undersigned
      certifies that this brief complies with the applicable
      word count limit. This brief contains {word_count} words
      (excluding those parts of the brief that are excluded
      under Va. R. Sup. Ct. 5A:4(g)).

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I certify that on {date}, a copy of this brief was served
      on all counsel of record by {service_method}.

      {attorney_name}

signature_block_required: true
