# Minnesota Court of Appeals - Appellate Brief Format
# Based on Minn. R. Civ. App. P. 128.02, 132.01
# Formatting requirements per Minnesota Rules of Civil Appellate Procedure.
#
# Key conventions:
# - Margins: 1" top/bottom, 1.5" left/right
# - Font: Times New Roman 14pt, double-spaced
# - Word limit: 14,000 words (principal brief)
# - "Legal Issues" section required
# - Certificate of compliance and length required

jurisdiction: minnesota
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 14
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.5
  margin_right_inches: 1.5
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Table of Cases and Authorities"
      - "Authorities Cited"
      - "Cases Cited"
    order: 2
    required: true
    heading_level: 1

  - id: legal_issues
    canonical_name: "Legal Issues"
    aliases:
      - "Statement of the Issues"
      - "Statement of Issues"
      - "Issues Presented"
      - "Issues Presented for Review"
      - "Issues"
      - "Questions Presented"
      - "Statement of Legal Issues"
    order: 3
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Statement of Case"
      - "Procedural History"
      - "Procedural Background"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of the Facts"
    aliases:
      - "Statement of Facts"
      - "Facts"
      - "Factual Background"
    order: 5
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
    order: 6
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 7
    required: true
    heading_level: 1

  - id: addendum
    canonical_name: "Addendum"
    aliases:
      - "Appendix"
      - "Statutory Addendum"
    order: 8
    required: false
    heading_level: 1

  - id: certificate_of_service
    canonical_name: "Certificate of Service"
    aliases:
      - "Proof of Service"
      - "Service Certificate"
    order: 9
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: title
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: true
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {firm_name}

    By: ____________________________
    {attorney_name}
    Attorney Reg. No. {bar_number}

    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

    Dated: {date}

certifications:
  - id: certificate_of_length
    title: "Certificate of Brief Length"
    template: |
      I hereby certify that this brief conforms to the
      requirements of Minn. R. Civ. App. P. 132.01, subds.
      1 and 3. The length of this brief is {word_count} words.

      This brief was prepared with Microsoft Word using
      Times New Roman, 14-point proportionally spaced font.

      Dated: {date}

      {attorney_name}
      Attorney for {party_role}

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that on {date}, I served this brief
      by [method of service] upon all parties to this appeal.

      {attorney_name}

signature_block_required: true
