# Nebraska Court of Appeals - Appellate Brief Format
# Based on Neb. Ct. R. App. P. § 2-109 and Neb. Ct. R. § 6-1503
# Key conventions:
# - Margins: 1" all sides
# - Font: Century Schoolbook or Times New Roman 12pt, double-spaced
# - Page limit: 50 pages for appellant brief
# - Certifications include word count and service

jurisdiction: nebraska
court_level: appellate
document_type: brief

page_format:
  font_name: "Times New Roman"
  font_size_pt: 12.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
      - "Index"
    order: 1
    required: true
    heading_level: 1

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Authorities Cited"
      - "Table of Cases and Authorities"
      - "Cases Cited"
    order: 2
    required: true
    heading_level: 1

  - id: statement_of_issues
    canonical_name: "Assignments of Error"
    aliases:
      - "Errors Assigned"
      - "Statement of Errors"
      - "Issues Presented"
      - "Questions Presented"
      - "Statement of the Issues"
    order: 3
    required: true
    heading_level: 1

  - id: propositions_of_law
    canonical_name: "Propositions of Law"
    aliases:
      - "Standards of Review"
      - "Propositions"
    order: 4
    required: true
    heading_level: 1

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Case Statement"
      - "Statement of Case"
      - "Procedural History"
      - "Procedural Background"
    order: 5
    required: true
    heading_level: 1

  - id: statement_of_facts
    canonical_name: "Statement of Facts"
    aliases:
      - "Facts"
      - "Factual Background"
      - "Statement of the Facts"
    order: 6
    required: true
    heading_level: 1

  - id: argument
    canonical_name: "Argument"
    aliases:
      - "Arguments"
      - "Discussion"
      - "Summary of Argument"
    order: 7
    required: true
    heading_level: 1

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
      - "Relief Requested"
    order: 8
    required: true
    heading_level: 1

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: right
  case_number_prefix: "Case No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: true
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    {attorney_title}
    Bar No. {bar_number}

    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Attorney for {party_role}

certifications:
  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that on {date}, a true and correct copy of
      the foregoing was served upon all parties of record by
      {service_method}.

      {attorney_name}

  - id: certificate_of_compliance
    title: "Certificate of Compliance"
    template: |
      I hereby certify that this brief complies with the page and
      type-volume limitations of Neb. Ct. R. App. P. § 2-109.
      This brief contains {word_count} words and {page_count} pages.

signature_block_required: true
