# United States Supreme Court - Petition for Writ of Certiorari (8.5x11 format)
# Based on Supreme Court Rule 33.2 (booklet-format exemption) and Rule 14
# See also Rules 21, 24, 33, 34
#
# This ruleset covers the 8.5x11 paper format used for in forma pauperis
# petitions, cert petitions filed under Rule 33.2, and similar filings.
# The booklet format (Rule 33.1) uses different page dimensions and is
# not covered here.
#
# Key conventions:
# - Margins: 1 inch on all sides (Rule 33.2)
# - Font: Century family, 12pt (Rule 33.1(b)); for 8.5x11, comparable proportional font
# - Line spacing: Double-spaced (Rule 33.2)
# - Word limit: 9,000 words for cert petitions (Rule 33.1(g))
# - Questions Presented must appear on first page after cover (Rule 14.1(a))

jurisdiction: federal
court_level: scotus
document_type: brief

page_format:
  font_name: "Century Schoolbook"
  font_size_pt: 12.0
  line_spacing: 2.0
  margin_top_inches: 1.0
  margin_bottom_inches: 1.0
  margin_left_inches: 1.0
  margin_right_inches: 1.0
  page_width_inches: 8.5
  page_height_inches: 11.0

heading_rules:
  - level: 1
    case_style: upper
    alignment: center
    numbering: null
    bold: true
  - level: 2
    case_style: upper
    alignment: left
    numbering: roman
    bold: true
  - level: 3
    case_style: title
    alignment: left
    numbering: alpha_upper
    bold: true
  - level: 4
    case_style: sentence
    alignment: left
    numbering: arabic
    bold: false

required_sections:
  - id: questions_presented
    canonical_name: "Questions Presented"
    aliases:
      - "Questions Presented for Review"
      - "Question Presented"
      - "Question Presented for Review"
    order: 1
    required: true
    heading_level: 1
    group: null

  - id: parties_to_proceeding
    canonical_name: "Parties to the Proceeding"
    aliases:
      - "Parties"
      - "List of Parties"
      - "Parties to the Proceeding and Rule 29.6 Statement"
      - "Corporate Disclosure Statement and Parties"
    order: 2
    required: true
    heading_level: 1
    group: null

  - id: related_proceedings
    canonical_name: "Related Proceedings"
    aliases:
      - "List of Related Proceedings"
      - "Related Cases"
      - "Directly Related Proceedings"
    order: 3
    required: false
    heading_level: 1
    group: null

  - id: table_of_contents
    canonical_name: "Table of Contents"
    aliases:
      - "Contents"
    order: 4
    required: true
    heading_level: 1
    group: null

  - id: table_of_authorities
    canonical_name: "Table of Authorities"
    aliases:
      - "Table of Authorities Cited"
      - "Authorities Cited"
    order: 5
    required: true
    heading_level: 1
    group: null

  - id: opinions_below
    canonical_name: "Opinions Below"
    aliases:
      - "Opinion Below"
      - "Decisions Below"
      - "Decision Below"
    order: 6
    required: true
    heading_level: 1
    group: null

  - id: jurisdictional_statement
    canonical_name: "Jurisdictional Statement"
    aliases:
      - "Jurisdiction"
      - "Statement of Jurisdiction"
      - "Basis for Jurisdiction"
    order: 7
    required: true
    heading_level: 1
    group: null

  - id: constitutional_provisions
    canonical_name: "Constitutional and Statutory Provisions Involved"
    aliases:
      - "Relevant Statutory Provisions"
      - "Constitutional Provisions Involved"
      - "Statutory Provisions Involved"
      - "Relevant Constitutional and Statutory Provisions"
    order: 8
    required: true
    heading_level: 1
    group: null

  - id: statement_of_case
    canonical_name: "Statement of the Case"
    aliases:
      - "Statement"
      - "Statement of Facts"
      - "Statement of the Facts"
      - "Factual and Procedural Background"
    order: 9
    required: true
    heading_level: 1
    group: null

  - id: reasons_for_granting
    canonical_name: "Reasons for Granting the Petition"
    aliases:
      - "Reasons for Granting the Writ"
      - "Reasons for Granting Certiorari"
      - "Argument"
    order: 10
    required: true
    heading_level: 1
    group: null

  - id: conclusion
    canonical_name: "Conclusion"
    aliases:
      - "Prayer for Relief"
    order: 11
    required: true
    heading_level: 1
    group: null

  - id: appendix
    canonical_name: "Appendix"
    aliases:
      - "Appendices"
      - "App."
    order: 12
    required: false
    heading_level: 1
    group: null

caption_rule:
  court_line_style: upper
  court_line_alignment: center
  case_number_alignment: center
  case_number_prefix: "No."
  party_separator: "v."
  party_name_style: upper
  party_role_style: title
  party_alignment: center
  party_role_indented: false
  document_title_style: upper
  document_title_alignment: center
  include_district: false
  include_appeal_from: true
  appeal_from_style: sentence
  appeal_from_alignment: center

signature_block:
  template: |
    Respectfully submitted,

    {attorney_name_caps}
    Counsel of Record
    {office_name}
    {address_line_1}
    {address_line_2}
    {phone}
    {email}

    Counsel for {party_role}

certifications:
  - id: word_count
    title: null
    template: |
      As required by Supreme Court Rule 33.1(h), I certify that
      the petition for a writ of certiorari contains {word_count}
      words, excluding the parts of the document that are exempted
      by Supreme Court Rule 33.1(d).

  - id: certificate_of_service
    title: "Certificate of Service"
    template: |
      I hereby certify that on {date}, I caused {copies} copies
      of the foregoing {document_title} to be served on each party
      to the above proceeding or that party's counsel, and on every
      other person required to be served, by depositing an envelope
      containing the above document in the United States mail properly
      addressed to each of them and with first-class postage prepaid.

      {attorney_name_caps}

signature_block_required: true
