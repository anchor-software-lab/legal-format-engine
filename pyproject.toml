[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-format-engine"
version = "0.1.0"
description = "Rules-based legal document formatting engine with court e-filing requirements scraper"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_format_engine"]
