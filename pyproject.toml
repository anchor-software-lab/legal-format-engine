[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-format-engine"
version = "0.1.0"
description = "Rules-based legal document formatting engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0,<9",
    "fastapi>=0.115,<1",
    "pydantic>=2.0,<3",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
legal-format = "legal_format_engine.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_format_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
