[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-format-engine"
version = "0.1.0"
description = "Rules-based legal document formatting engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "python-docx>=1.1,<2",
    "pyyaml>=6.0,<7",
    "click>=8.0,<9",
    "pymupdf>=1.24,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
tf = [
    "tensorflow>=2.15",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",
]

[project.scripts]
legal-format = "legal_format_engine.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
