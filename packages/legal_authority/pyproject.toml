[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-authority"
version = "0.1.0"
description = "Legal authority lookup, good-law tracking, citator graph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "vcrpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_authority"]
