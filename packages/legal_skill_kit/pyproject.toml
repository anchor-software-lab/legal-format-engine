[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-skill-kit"
version = "0.1.0"
description = "Builds the distributable Claude skill for the Anchor Quality Gate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_skill_kit"]
