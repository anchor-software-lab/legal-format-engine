[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-quality-gate"
version = "0.1.0"
description = "Orchestrator and checker registry for the Anchor Quality Gate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "legal-format-engine>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_quality_gate"]
