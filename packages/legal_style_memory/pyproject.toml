[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-style-memory"
version = "0.1.0"
description = "Per-firm style guides, user preferences, correction history"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_style_memory"]
