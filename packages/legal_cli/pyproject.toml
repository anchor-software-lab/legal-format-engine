[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-cli"
version = "0.1.0"
description = "Command-line interface for the Anchor Quality Gate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0,<7",
    "legal-format-engine>=0.1.0",
    "legal-quality-gate>=0.1.0",
    "legal-docx>=0.1.0",
    "legal-citations>=0.1.0",
    "legal-llm-gateway>=0.1.0",
    "legal-authority>=0.1.0",
    "legal-skill-kit>=0.1.0",
]

[project.scripts]
lqg = "legal_cli.__main__:app"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_cli"]
