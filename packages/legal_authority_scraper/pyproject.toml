[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-authority-scraper"
version = "0.1.0"
description = "Backend scraper service for WI and federal legal authority"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "selectolax>=0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest", "vcrpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_authority_scraper"]
