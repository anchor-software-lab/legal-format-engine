[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-api"
version = "0.1.0"
description = "FastAPI SaaS surface for the Anchor Quality Gate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "redis>=5.0",
    "rq>=1.16",
    "cryptography>=42",
    "legal-quality-gate>=0.1.0",
    "legal-docx>=0.1.0",
    "legal-citations>=0.1.0",
    "legal-authority>=0.1.0",
    "legal-llm-gateway>=0.1.0",
    "legal-style-memory>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "schemathesis"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_api"]
