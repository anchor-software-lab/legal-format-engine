[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-format-engine"
version = "0.1.0"
description = "Rules-based legal document formatting engine with ML-learned pattern support"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "legal-quality-gate>=0.1.0",
]

[project.optional-dependencies]
ml = [
    "anchor-ml-engine>=0.1.0",
]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_format_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
