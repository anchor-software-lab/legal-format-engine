[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-citations"
version = "0.1.0"
description = "Bluebook citation parsing, normalization, and validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "eyecite>=2.6",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_citations"]
