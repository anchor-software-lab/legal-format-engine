[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anchor-ml-engine"
version = "0.1.0"
description = "Domain-agnostic ML engine for document format learning and style synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
tf = ["tensorflow>=2.15"]
legal = [
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anchor_ml_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
